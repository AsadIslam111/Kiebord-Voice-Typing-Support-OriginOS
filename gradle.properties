# Gradle JVM memory options tailored for current free memory (1.5GB heap, 384MB metaspace)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m

# AndroidX enabled
android.useAndroidX=true

# Performance optimizations
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false
kotlin.code.style=official

# Suppress Kotlin daemon warning
kotlin.incremental=true
