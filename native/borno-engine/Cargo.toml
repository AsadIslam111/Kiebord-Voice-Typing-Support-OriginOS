[package]
name = "borno-engine"
version = "0.2.8"
edition = "2021"
authors = ["Kiebord Authors"]
description = "High-performance hybrid spatial Borno Keyboard core and Borno phonetic engine in pure Rust"

[lib]
name = "borno_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }
memmap2 = "0.9.4"
parking_lot = "0.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
